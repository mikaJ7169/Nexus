<!DOCTYPE html>
<html lang="fr" data-theme="clair">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NEXUS — Hub personnel</title>
<script src="theme.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="bg"></canvas>
<div class="blob blob-a"></div>
<div class="blob blob-b"></div>
<div class="blob blob-c"></div>

<header id="titlebar">
  <button id="btn-menu" class="menu-btn" title="Menu">☰<span>MENU</span></button>
  <div class="brand">
    <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
      <defs>
        <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffb340"/>
          <stop offset="0.55" stop-color="#ff8a00"/>
          <stop offset="1" stop-color="#ff5f00"/>
        </linearGradient>
      </defs>
      <path class="logo-drop" d="M24 3.5c7.6 9.6 13.5 15.9 13.5 23.5a13.5 13.5 0 1 1-27 0C10.5 19.4 16.4 13.1 24 3.5z" fill="url(#lg)"/>
      <ellipse cx="18.5" cy="27" rx="4.6" ry="7.6" fill="rgba(255,255,255,0.55)" transform="rotate(-16 18.5 27)"/>
      <circle cx="30.5" cy="33.5" r="2.1" fill="rgba(255,255,255,0.35)"/>
    </svg>
    <span class="brand-name">NEXUS</span>
  </div>
  <div class="titlebar-drag"></div>
  <div class="win-controls">
    <button id="btn-min" class="wc" title="Réduire">–</button>
    <button id="btn-max" class="wc" title="Agrandir / Réduire">▢</button>
    <button id="btn-close" class="wc danger" title="Fermer">✕</button>
  </div>
</header>

<main id="main">
  <section id="view-dashboard" class="view active">
    <div class="dash-head">
      <div>
        <h1 id="dash-greeting">Bonjour</h1>
        <p id="dash-date" class="muted"></p>
      </div>
      <div class="clock">
        <div id="clock-time">00:00:00</div>
        <div id="clock-sub" class="muted"></div>
      </div>
    </div>
    <div class="dash-grid">
      <div class="card glass">
        <h2>📅 Aujourd'hui</h2>
        <div id="dash-events" class="stack"></div>
      </div>
      <div class="card glass">
        <h2>⏰ Prochains rappels</h2>
        <div id="dash-reminders" class="stack"></div>
      </div>
      <div class="card glass">
        <h2>🚀 Accès rapide</h2>
        <div id="dash-apps" class="mini-tiles"></div>
      </div>
      <div class="card glass">
        <h2>📊 En bref</h2>
        <div id="dash-stats" class="stats"></div>
      </div>
    </div>
  </section>

  <section id="view-planning" class="view">
    <div class="view-head">
      <h1>Emploi du temps</h1>
      <div class="week-nav">
        <button id="week-prev" class="btn ghost" title="Semaine précédente">‹</button>
        <span id="week-label" class="muted"></span>
        <button id="week-next" class="btn ghost" title="Semaine suivante">›</button>
        <button id="week-today" class="btn">Aujourd'hui</button>
        <button id="ics-import" class="btn">📥 .ics</button>
        <input id="ics-input" type="file" accept=".ics,text/calendar" multiple hidden>
        <button id="event-add" class="btn primary">+ Événement</button>
      </div>
    </div>
    <div class="card glass week-scroll">
      <div class="week-grid">
        <div class="wg-corner"></div>
        <div class="wg-days" id="wg-days"></div>
        <div class="wg-times" id="wg-times"></div>
        <div class="wg-body" id="wg-body"></div>
      </div>
    </div>
  </section>

  <section id="view-reminders" class="view">
    <div class="view-head">
      <h1>Rappels</h1>
      <span class="muted" id="rem-count"></span>
    </div>
    <form id="reminder-form" class="card glass form-row">
      <input id="rem-title" type="text" placeholder="Titre du rappel…" maxlength="80" required>
      <input id="rem-date" type="date" required>
      <input id="rem-time" type="time" required>
      <label class="chk"><input type="checkbox" id="rem-sound" checked><span class="box"></span><span>Sonnerie</span></label>
      <button class="btn primary" type="submit">+ Ajouter</button>
    </form>
    <div class="card glass">
      <div id="reminder-list" class="rem-list"></div>
    </div>
  </section>

  <section id="view-hub" class="view">
    <div class="view-head">
      <h1>Hub d'apps</h1>
      <div class="chips" id="hub-filters"></div>
    </div>
    <div id="hub-grid" class="hub-grid"></div>
  </section>

  <section id="view-files" class="view">
    <div class="view-head">
      <h1>Fichiers</h1>
      <div class="row-actions">
        <button id="files-pick" class="btn">＋ Ajouter…</button>
        <button id="files-open-dir" class="btn primary">Dossier ↗</button>
      </div>
    </div>
    <div class="card glass dropzone" id="dropzone">
      <div class="drop-hint" id="drop-hint">⬇ Déposer des fichiers · <code id="files-dir">…</code></div>
      <div id="files-list" class="files-list"></div>
    </div>
  </section>

  <section id="view-portfolio" class="view">
    <div class="view-head">
      <h1>Portfolio</h1>
    </div>
    <div class="card glass pro-card">
      <h2>💼 Portfolio professionnel</h2>
      <div class="form-row">
        <input id="pro-url" type="url" placeholder="https://…">
        <button id="pro-save" class="btn">Enregistrer</button>
        <button id="pro-open" class="btn primary">Ouvrir ↗</button>
      </div>
    </div>
    <h2 class="section-sub">🎨 Portfolio perso</h2>
    <div id="perso-grid" class="perso-grid"></div>
  </section>
</main>

<div id="menu-overlay" hidden>
  <div class="menu-panel">
    <div class="menu-top">
      <div class="brand">
        <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
          <path d="M24 3.5c7.6 9.6 13.5 15.9 13.5 23.5a13.5 13.5 0 1 1-27 0C10.5 19.4 16.4 13.1 24 3.5z" fill="url(#lg)"/>
          <ellipse cx="18.5" cy="27" rx="4.6" ry="7.6" fill="rgba(255,255,255,0.55)" transform="rotate(-16 18.5 27)"/>
        </svg>
        <span class="brand-name">NEXUS</span>
      </div>
      <button id="menu-close" class="icon-btn" title="Fermer">✕</button>
    </div>
    <div class="menu-cols">
      <nav class="menu-list" id="menu-list">
        <button class="menu-item" data-view="hub"><span class="mi-num">01</span><span class="mi-body"><span class="mi-title">Hub d'apps</span><span class="mi-sub">Jeux · applis · liens</span></span><span class="mi-ic">🚀</span></button>
        <button class="menu-item" data-view="dashboard"><span class="mi-num">02</span><span class="mi-body"><span class="mi-title">Tableau de bord</span><span class="mi-sub">Aujourd'hui, rappels, stats</span></span><span class="mi-ic">📊</span></button>
        <button class="menu-item" data-view="planning"><span class="mi-num">03</span><span class="mi-body"><span class="mi-title">Emploi du temps</span><span class="mi-sub">Semaine + import .ics</span></span><span class="mi-ic">📅</span></button>
        <button class="menu-item" data-view="reminders"><span class="mi-num">04</span><span class="mi-body"><span class="mi-title">Rappels</span><span class="mi-sub">Notifications</span></span><span class="mi-ic">⏰</span></button>
        <button class="menu-item" data-view="files"><span class="mi-num">05</span><span class="mi-body"><span class="mi-title">Fichiers</span><span class="mi-sub">Dossier partagé NEXUS</span></span><span class="mi-ic">📁</span></button>
        <button class="menu-item" data-view="portfolio"><span class="mi-num">06</span><span class="mi-body"><span class="mi-title">Portfolio</span><span class="mi-sub">Pro & perso</span></span><span class="mi-ic">💼</span></button>
      </nav>
      <div class="menu-side">
        <button id="menu-vibe" class="vibe-cta"><span class="vibe-ic">🟠</span><span class="vibe-txt"><b>Vibe</b><small>Mistral · ouvrir directement</small></span><span class="vibe-arrow">↗</span></button>
        <div class="menu-sec">Thème</div>
        <div class="theme-row" id="theme-row"></div>
        <div class="menu-sec">Affichage</div>
        <label class="chk menu-check"><input type="checkbox" id="autohide-toggle"><span class="box"></span><span>Masquer en haut de l’écran</span></label>
        <div class="menu-foot">NEXUS v3 · <span id="platform-label">…</span></div>
      </div>
    </div>
  </div>
</div>

<div id="drop-overlay"><div class="drop-overlay-inner">⬇ Déposer dans NEXUS</div></div>
<div id="modal-root"></div>
<div id="toast-root"></div>
<script src="ics.js"></script>
<script src="app.js"></script>
</body>
</html>
